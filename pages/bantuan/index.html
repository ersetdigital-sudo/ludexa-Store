<script>
const F=[["bayar", "Pembayaran", [["Metode pembayaran apa saja yang tersedia?", "Saat ini pembayaran utama melalui QRIS. Scan QRIS dengan aplikasi bank atau e-wallet apa pun (DANA, OVO, GoPay, ShopeePay, m-banking)."], ["Kenapa harus memasukkan nominal persis?", "QRIS kami bersifat statis, jadi nominal diketik manual. Nominal yang persis sama dengan total memudahkan tim kami mencocokkan pembayaran Anda."], ["Saya sudah bayar, kenapa statusnya masih \"Sedang dicek\"?", "Setiap pembayaran diverifikasi manual oleh tim kami. Agar lebih cepat, klik \"Konfirmasi via WhatsApp\" dan kirim bukti pembayaran."]]], ["tx", "Transaksi", [["Bagaimana cara cek status transaksi?", "Buka menu Cek Transaksi, lalu masukkan kode referensi (REF-LDX…) atau nomor tujuan."], ["Berapa lama transaksi diproses?", "Transaksi diproses setelah pembayaran terverifikasi. Hubungi CS jika status belum berubah."], ["Saya salah memasukkan nomor tujuan, bagaimana?", "Segera hubungi CS via WhatsApp dengan menyertakan kode referensi. Transaksi yang sudah terkirim ke nomor yang salah tidak selalu dapat dibatalkan."]]], ["refund", "Gagal & Refund", [["Bagaimana jika transaksi gagal?", "Jika transaksi gagal setelah pembayaran terverifikasi, dana akan dikembalikan atau transaksi diproses ulang setelah konfirmasi dengan CS."], ["Token PLN belum masuk, apa yang harus dilakukan?", "Cek status di menu Cek Transaksi. Jika sudah lama belum ada token, hubungi CS dengan kode referensi Anda."]]], ["promo", "Promo & Voucher", [["Bagaimana cara memakai kode voucher?", "Masukkan kode di kolom \"Kode voucher\" pada ringkasan transaksi lalu klik Pakai. Potongan langsung terlihat di total."], ["Kenapa voucher saya tidak bisa dipakai?", "Setiap voucher punya syarat, misalnya hanya untuk layanan tertentu atau minimal transaksi. Pesan di bawah kolom voucher akan menjelaskan alasannya."]]], ["akun", "Keamanan", [["Apakah data saya aman?", "Kami hanya menggunakan data yang diperlukan untuk memproses transaksi. Selengkapnya di halaman Kebijakan Privasi."], ["Apakah CS akan meminta PIN atau OTP?", "Tidak pernah. Jangan bagikan PIN, kata sandi, atau kode OTP kepada siapa pun yang mengaku sebagai CS Ludexa Store."]]]];const $=x=>document.getElementById(x);let topic='all';
const ALL=[['all','Semua']].concat(F.map(f=>[f[0],f[1]]));
function draw(){const q=$('s').value.trim().toLowerCase();
$('topics').innerHTML=ALL.map(t=>`<button data-t="${t[0]}" class="topic rounded-full border border-[#f2dde6] bg-white py-2 px-4 text-sm font-semibold whitespace-nowrap ${t[0]===topic&&!q?'active':''}">${t[1]}</button>`).join('');
let items=[];F.forEach(f=>{if(q||topic==='all'||topic===f[0])f[2].forEach(x=>items.push([f[1],x[0],x[1]]))});
if(q)items=items.filter(i=>(i[1]+' '+i[2]).toLowerCase().includes(q));
$('ttl').textContent=q?`Hasil untuk "${$('s').value}"`:(ALL.find(t=>t[0]===topic)[1]==='Semua'?'Semua pertanyaan':ALL.find(t=>t[0]===topic)[1]);
$('list').innerHTML=items.map(i=>`<details class="acc bg-white rounded-2xl border border-[#f4e8ee] px-5 py-4 group"><summary class="flex items-center justify-between gap-4 cursor-pointer"><span><span class="block text-xs font-bold text-[#e0337a] mb-1">${i[0]}</span><span class="font-bold">${i[1]}</span></span><span class="chev w-8 h-8 shrink-0 rounded-full bg-[#fff0f6] text-[#e0337a] grid place-items-center text-xl font-light">+</span></summary><p class="text-[#5a4b58] leading-relaxed mt-3 pr-10">${i[2]}</p></details>`).join('');
$('empty').classList.toggle('hidden',items.length>0)}
$('topics').onclick=e=>{const b=e.target.closest('[data-t]');if(b){topic=b.dataset.t;$('s').value='';draw()}};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{topic=b.dataset.go;$('s').value='';draw();$('ttl').scrollIntoView({behavior:'smooth',block:'center'})});
$('s').oninput=draw;draw();
</script></body></html>
